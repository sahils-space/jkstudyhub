<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" width="500" height="620">
  <defs>
    <linearGradient id="bg_atomic-habits" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdfa"/>
      <stop offset="100%" stop-color="#f7f3ec"/>
    </linearGradient>
    <linearGradient id="spine_shading_atomic-habits" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="book_shadow_atomic-habits" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="8" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Clean Transparent Canvas -->
  
  <!-- Physical 3D Book Cover -->
  <g transform="translate(60, 30)" filter="url(#book_shadow_atomic-habits)">
    <!-- Back Page Edge / Thickness Preview -->
    <path d="M 370 15 L 382 25 L 382 545 L 370 535 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.5"/>
    <path d="M 12 525 L 370 525 L 382 535 L 24 535 Z" fill="#cbd5e1"/>
    
    <!-- Main Cover Front -->
    <rect x="10" y="10" width="360" height="520" rx="8" fill="url(#bg_atomic-habits)" stroke="#e2e8f0" stroke-width="1.5"/>
    
    <!-- Spine Lighting Crease -->
    <rect x="10" y="10" width="28" height="520" rx="4" fill="url(#spine_shading_atomic-habits)"/>
    <line x1="38" y1="10" x2="38" y2="530" stroke="#000000" stroke-opacity="0.1" stroke-width="1"/>

    <!-- Quality Badge -->
    <rect x="42" y="36" width="130" height="26" rx="13" fill="#d97706" opacity="0.95"/>
    <text x="107" y="53" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">★ BESTSELLER #1</text>

    <!-- Student Edition Tag -->
    <rect x="250" y="36" width="105" height="26" rx="6" fill="#000000" fill-opacity="0.08"/>
    <text x="302" y="53" fill="#18181b" opacity="0.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">VERIFIED COPY</text>

    <!-- Book Title -->
    <g transform="translate(42, 130)">
      <text x="0" y="35" fill="#18181b" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="bold" letter-spacing="-0.5">
        Atomic Habits
      </text>
    </g>

    <!-- Subtitle / Hook -->
    <g transform="translate(42, 225)">
      <text x="0" y="20" fill="#18181b" opacity="0.85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600" width="290">
        Tiny Changes, Remarkable Results
      </text>
      <text x="0" y="42" fill="#18181b" opacity="0.85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600" width="290">
        
      </text>
    </g>

    <!-- Decorative Central Seal / Art Accent -->
    <circle cx="190" cy="330" r="42" fill="#d97706" opacity="0.12"/>
    <circle cx="190" cy="330" r="34" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="190" y="335" fill="#d97706" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">ORIGINAL</text>
    <text x="190" y="348" fill="#18181b" opacity="0.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">STUDENT PRINT</text>

    <!-- Author Name -->
    <line x1="42" y1="415" x2="335" y2="415" stroke="#18181b" stroke-opacity="0.15" stroke-width="1"/>
    <text x="42" y="445" fill="#18181b" opacity="0.65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">AUTHOR</text>
    <text x="42" y="475" fill="#18181b" font-family="Georgia, serif" font-size="22" font-weight="bold">
      James Clear
    </text>

    <!-- Footer Bar -->
    <rect x="10" y="505" width="360" height="25" fill="#18181b" fill-opacity="0.04"/>
    <text x="190" y="521" fill="#18181b" opacity="0.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">JK Study Hub Verified Edition • Fast Delivery in Pattan</text>
  </g>
</svg>