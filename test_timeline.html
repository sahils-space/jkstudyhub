<style>
/* Order Tracking Timeline */
.order-track { display: flex; justify-content: space-between; align-items: center; margin: 20px 0; position: relative; }
.order-track::before { content: ''; position: absolute; top: 12px; left: 10%; right: 10%; height: 4px; background: #e2e8f0; z-index: 1; border-radius: 4px; }
.track-progress { position: absolute; top: 12px; left: 10%; height: 4px; background: #2563eb; z-index: 2; border-radius: 4px; transition: width 0.5s ease; }
.track-step { position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; width: 25%; }
.track-icon { width: 28px; height: 28px; border-radius: 50%; background: #e2e8f0; color: #94a3b8; display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: bold; border: 3px solid white; box-shadow: 0 0 0 2px #e2e8f0; transition: all 0.3s; }
.track-step.active .track-icon { background: #2563eb; color: white; box-shadow: 0 0 0 2px #2563eb; }
.track-label { margin-top: 8px; font-size: 11px; font-weight: 700; color: #64748b; text-align: center; }
.track-step.active .track-label { color: #1e293b; }
@keyframes pulseGlow { 0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.4); } 70% { box-shadow: 0 0 0 6px rgba(37, 99, 235, 0); } 100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); } }
.track-step.current .track-icon { animation: pulseGlow 2s infinite; }
</style>
