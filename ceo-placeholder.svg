<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="300" height="360" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative circles -->
  <circle cx="150" cy="180" r="120" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <circle cx="150" cy="180" r="95" fill="none" stroke="rgba(56,189,248,0.15)" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Head -->
  <circle cx="150" cy="120" r="46" fill="#334155"/>
  <circle cx="150" cy="120" r="43" fill="#cbd5e1"/>

  <!-- Body / Shoulders -->
  <path d="M75 255 C75 190, 225 190, 225 255 Z" fill="#334155"/>
  <path d="M85 255 C85 200, 215 200, 215 255 Z" fill="#475569"/>

  <!-- Tie & Collar -->
  <polygon points="150,185 142,165 158,165" fill="#f8fafc"/>
  <polygon points="146,185 154,185 157,245 150,255 143,245" fill="url(#accentGrad)"/>

  <!-- Frame label -->
  <rect x="35" y="290" width="230" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
  <text x="150" y="313" text-anchor="middle" fill="#94a3b8" font-family="'Outfit', -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1">PHOTO PLACEHOLDER</text>
</svg>
